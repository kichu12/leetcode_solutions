<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Amritha 💘</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
    color: white;
    text-align: center;
  }

  h1 {
    font-size: 34px;
    margin-bottom: 20px;
  }

  #buttons {
    position: relative;
    height: 120px;
  }

  button {
    padding: 14px 30px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    position: absolute;
    transition: transform 0.2s;
  }

  #yes {
    background: #28a745;
    color: white;
    position: static;
  }

  #no {
    background: #dc3545;
    color: white;
  }

  #plea {
    margin-top: 80px;
    font-size: 18px;
    opacity: 0.9;
  }

  #finalImg {
    display: none;
    width: 240px;
    margin-top: 20px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  #love {
    display: none;
    font-size: 40px;
    font-weight: bold;
    margin-top: 15px;
  }

  /* Floating hearts */
  .heart {
    position: absolute;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
  }

  @keyframes floatUp {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to { transform: translateY(-100vh) scale(1.8); opacity: 0; }
  }
</style>
</head>

<body>

<h1>Amritha 💖<br>Will you be my Valentine?</h1>

<div id="buttons">
  <button id="yes" onclick="sayYes()">YES 💕</button>
  <button id="no" onmouseover="escapeNo()">NO 😭</button>
</div>

<div id="plea">Don’t click NO 😭💔</div>

<!-- Image shown AFTER YES -->
<img id="finalImg" src="hug.png" alt="Cute couple hugging">

<div id="love">Love youuuu 💕💕</div>

<!-- Background music -->
<audio autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
  let scale = 1;
  let rotation = 0;

  const messages = [
    "Don’t click NO 😭💔",
    "Please say YES 🥺❤️",
    "I’ll cry 😢",
    "My heart 💔💔",
    "Say YES pleaseee 🥹"
  ];

  function escapeNo() {
    const noBtn = document.getElementById("no");
    const plea = document.getElementById("plea");

    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 140);

    scale -= 0.05;
    rotation += 45;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
    noBtn.style.transform = `scale(${scale}) rotate(${rotation}deg)`;

    plea.innerText = messages[Math.floor(Math.random() * messages.length)];

    if (scale < 0.4) scale = 0.4;
  }

  function sayYes() {
    document.querySelector("h1").style.display = "none";
    document.getElementById("buttons").style.display = "none";
    document.getElementById("plea").style.display = "none";

    document.getElementById("finalImg").style.display = "block";
    document.getElementById("love").style.display = "block";
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💕";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.bottom = "0px";
    heart.style.fontSize = (Math.random() * 20 + 15) + "px";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }

  setInterval(createHeart, 300);
</script>

</body>
</html>
